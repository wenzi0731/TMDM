[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tmdm-heew-baseline2"
version = "0.1.0"
description = "Condition-only TMDM adaptation for joint source-load scenario generation"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "torch>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["baseline2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

